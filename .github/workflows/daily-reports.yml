name: Daily Report

on:
  schedule:
    # 테스트용: 10분마다 실행
    # 원래 스케줄: 한국 시간 새벽 4시 (KST 04:00 = UTC 19:00 전날) - cron: "0 19 * * *"
    - cron: "*/10 * * * *"
  workflow_dispatch: # 수동 실행도 가능하도록

jobs:
  run-daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: hsy-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./hsy
        run: uv sync

      - name: Verify environment variables
        run: |
          if [ -z "${{ secrets.NAVER_CLIENT_SECRET }}" ]; then
            echo "Error: NAVER_CLIENT_SECRET is not set"
            exit 1
          fi
          if [ -z "${{ secrets.NAVER_CLIENT_ID }}" ]; then
            echo "Error: NAVER_CLIENT_ID is not set"
            exit 1
          fi
          if [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "Error: OPENROUTER_API_KEY is not set"
            exit 1
          fi
          echo "All environment variables are set"

      - name: Run daily report
        working-directory: ./hsy
        env:
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run main.py

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports
          path: hsy/daily_reports/
          retention-days: 30
